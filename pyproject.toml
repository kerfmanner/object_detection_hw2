[project]
name = "drone-image-object-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kerfmanner", email = "konovluka@email.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-coco-eval>=1.8.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pycocotools>=2.0.11",
    "python-decouple>=3.8",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.199",
    "wandb>=0.31.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.5.0",
    "ipykernel>=7.4.0",
    "isort>=9.0.2",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.5",
    "nbconvert>=7.17.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ty>=0.0.96",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
