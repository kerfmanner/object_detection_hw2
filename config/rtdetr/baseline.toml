# RT-DETRv2 baseline: COCO-pretrained R50vd, AdamW per the RT-DETRv2 recipe with linear warmup then a constant LR, no EMA, no augmentation, frozen BatchNorm, checkpoint default queries, denoising, matcher, and losses
arch = "PekingU/rtdetr_v2_r50vd"  # Hugging Face checkpoint: PekingU/rtdetr_v2_r50vd or PekingU/rtdetr_v2_r18vd; both COCO-trained from an ImageNet-pretrained backbone (https://huggingface.co/PekingU/rtdetr_v2_r50vd)
revision = "282494075698cab9faa1096ae26856890030c817"  # Hugging Face commit of the checkpoint, pinned so that runs stay reproducible
init = "coco"  # pretrained weights: coco (the arch checkpoint), the only supported value; the encoder and decoder class heads and the denoising label embedding are new
trainable_backbone_layers = 4  # trainable backbone units counted from the last, 0 to 5 (stem and 4 ResNet stages, as in torchvision); 4 freezes only the stem, as freeze_at 0 in the official R50 recipe
train_frames = "train_tuning"  # [frame_steps] key in config/data.toml: train_tuning (step 5) or train_final (step 2)
train_splits = ["train"]  # clips trained on: ["train"] (the adopted split) or ["train", "val"] (final models for submission only: val is no longer held out, so per-epoch monitoring is skipped, best.pt is the last epoch, and the val metrics of the run are not comparable with other runs); val clips use the train_frames step
min_size = 1024  # shorter frame side after resizing, in px, rounded to the nearest px; every 16:9 frame becomes 1024 x 1820 px, the object scale of the torchvision families (not the processor's fixed 640 x 640)
max_size = 1824  # upper bound of the longer side after resizing, in px; resized frames are zero-padded at the bottom and right to a multiple of 32 px
epochs = 7  # training epochs, integer of at least 1; floor(5400 / 744) for the 1.5 GPU hour baseline budget, from the timing_b2 run (744 s/epoch on the PC)
batch_size = 2  # frames per forward pass, integer of at least 1; 2 peaks at 7.1 GB on the PC (timing_b2), while 4 overflowed its 12 GB into shared system memory (timing)
grad_accum = 2  # batches whose gradients are summed per optimizer step, integer of at least 1; effective batch size = batch_size * grad_accum = 4, as the torchvision families
num_workers = 4  # DataLoader worker processes decoding frames, integer of at least 0
lr = 0.0001  # AdamW learning rate of the encoder, decoder, and heads, positive; official RT-DETRv2 recipe value (at batch 16, not rescaled)
backbone_lr = 0.00001  # AdamW learning rate of the backbone parameters, at least 0; official R50 recipe value
weight_decay = 0.0001  # AdamW decoupled weight decay of all trainable parameters except the norm layers below; official recipe value
norm_weight_decay = 0.0  # AdamW weight decay of the BatchNorm and LayerNorm parameters outside the backbone; official recipe value 0
betas = [0.9, 0.999]  # AdamW beta1 and beta2; official recipe values
grad_clip_norm = 0.1  # maximum L2 norm of all gradients before an optimizer step, 0 disables clipping; official recipe clip_max_norm 0.1
schedule = "constant"  # LR schedule after warmup: constant, the only supported value (the official recipe's MultiStepLR milestone 1000 is never reached in its 72 epochs either)
warmup_iters = 2000  # linear LR warmup over this many optimizer steps, factor min(1, (step + 1) / warmup_iters), integer of at least 0; official LinearWarmup 2000; about 1.6 epochs at step 5 and effective batch 4
freeze_batchnorm = true  # BatchNorm layers outside the backbone (encoder, input projections) keep their COCO running statistics (eval mode) and are not trained; false trains them on batches of batch_size frames; backbone BatchNorm is always frozen (checkpoint config freeze_backbone_batch_norms)
amp = true  # mixed precision training on CUDA: true or false; CPU always trains in float32; inference is float32
amp_dtype = "bfloat16"  # autocast dtype when amp is true: bfloat16 (no gradient scaling; float32 on GPUs without native bfloat16, e.g. the Kaggle T4) or float16 (with gradient scaling); the RTX 5070 trains in bfloat16
seed = 42  # seed of the new class heads and denoising embedding, the shuffling order, and the denoising noise

[queries]
# Object and denoising queries; all values are the checkpoint defaults
num_queries = 300  # object queries selected from the encoder output; above the densest frame's 180 objects (01_eda.ipynb section 6)
num_denoising = 100  # denoising queries built from noised GT boxes during training (https://arxiv.org/abs/2203.01305); 0 disables denoising
label_noise_ratio = 0.5  # fraction of denoising queries whose class label is replaced by a random class
box_noise_scale = 1.0  # scale of the random box shift and resize of denoising queries, relative to the box size

[matcher]
# Hungarian matching cost between predictions and GT boxes; all values are the checkpoint defaults
class_cost = 2.0  # weight of the focal classification cost
bbox_cost = 5.0  # weight of the L1 cost on normalized cx, cy, w, h
giou_cost = 2.0  # weight of the generalized IoU cost
focal_alpha = 0.25  # alpha of the focal classification cost
focal_gamma = 2.0  # gamma of the focal classification cost

[loss]
# Training losses of matched queries; all values are the checkpoint defaults
vfl_weight = 1.0  # weight of the varifocal classification loss
bbox_weight = 5.0  # weight of the L1 box loss on normalized cx, cy, w, h
giou_weight = 2.0  # weight of the generalized IoU box loss
focal_alpha = 0.75  # alpha of the varifocal loss
focal_gamma = 2.0  # gamma of the varifocal loss
auxiliary_loss = true  # also apply the losses to every decoder layer, the encoder proposals, and the denoising queries

[inference]
score_thresh = 0.001  # minimum sigmoid class score of kept detections (strictly above), in [0, 1]; low so that AP integrates the full precision-recall curve
detections_per_img = 300  # top-scoring (query, class) pairs kept per frame without NMS, at most num_queries times the 8 classes and 500 (the submission limit); 300, the checkpoint default, means one pair per query on average
warmup_images = 10  # untimed forward passes on the first frame before measuring ms/image
hflip = false  # predict on horizontally flipped frames and mirror the boxes back: true for the flipped member of a flip TTA fusion (config/postprocess), false predicts the frames as they are
input_scale = 1.0  # linear factor in (0, 1] every frame is shrunk by (antialiased) before detection, with the boxes scaled back to the original frame; 1.0 predicts the frames as they are, 0.5 gives val frames the half resolution of the 680x382 and 960x540 test frames

[augment]
# Training augmentation of the shared loop, a subset of the official RT-DETRv2 recipe (https://github.com/lyuwenyu/RT-DETR/blob/main/rtdetrv2_pytorch/configs/rtdetrv2/include/dataloader.yml); all off in the baseline, which trains on unmodified frames
hflip = false  # flip each training frame and its boxes horizontally with probability 0.5 (recipe RandomHorizontalFlip)
photometric = false  # torchvision RandomPhotometricDistort with p 0.5 and its default ranges: brightness 0.875 to 1.125, contrast and saturation 0.5 to 1.5, hue -0.05 to 0.05, and channel permutation, each applied with probability 0.5 (recipe p 0.5)
train_scales = []  # multi-scale training: shorter frame sides in px, one drawn uniformly per batch, with max_size scaled by the same factor; repeated values are drawn more often; empty trains every batch at min_size
low_res_prob = 0.0  # probability in [0, 1] of shrinking a training frame and its boxes by low_res_factor (antialiased) before the detector resizes it to its input size, so that the frame keeps its scale and loses detail (Albumentations Downscale, https://github.com/albumentations-team/albumentations/blob/1.4.24/albumentations/augmentations/transforms.py#L3387); 0.0 keeps every frame at full resolution
low_res_factor = 0.5  # linear scale factor in (0, 1) of low_res_prob; 0.5 halves both sides, as from 1360x765 to the 680x382 test frames
clean_epochs = 0  # last epochs trained without hflip, photometric, low_res_prob, and train_scales, integer from 0 to epochs - 1 (the recipe switches them off for its last epoch of 72)

[ema]
# Exponential moving average of the weights (ModelEMA of the official RT-DETRv2 code, https://github.com/lyuwenyu/RT-DETR/blob/main/rtdetrv2_pytorch/src/optim/ema.py); when enabled, the per-epoch monitoring, best.pt, and last.pt hold the averaged weights
enabled = false  # true trains with the average and evaluates it, false uses the trained weights as they are
decay = 0.999  # weight of the previous average after the ramp, in (0, 1); the average spans about 1 / (1 - decay) = 1,000 optimizer steps, about 0.8 epoch at step 5 (1,230 steps per epoch at effective batch 4); the official 0.9999 spans 10,000 steps, more than a whole baseline run (8,600 steps)
warmup_steps = 100  # ramp decay * (1 - exp(-step / warmup_steps)), integer of at least 1; with the official 2,000 the decay stays below 0.71 until epoch 2, where every run so far peaks, so the average would equal the trained weights there

[ignored_regions]
# Ignored regions (crowds, dense parking, VisDrone others) in the training frames
mask = false  # fill the ignored regions of every training frame with fill, except the pixels of labelled boxes; monitoring, val, and test frames stay unmodified; false trains on unmodified frames, where ignored regions act as background
fill = [118, 124, 120]  # RGB fill colour, three integers 0 to 255: the train mean colour (01_eda.ipynb section 12.3)

[logging]
log_interval = 50  # batches between W&B points of the training losses and LR
sample_frames = 4  # monitoring val frames drawn with GT and predicted boxes to W&B after each epoch, evenly spaced
sample_score_thresh = 0.3  # minimum score of the predicted boxes drawn on those frames
